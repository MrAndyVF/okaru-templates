[catalog.discord]
name = "Discord"
category = "chat"

[config.custom_colors.added]
color = "#3fa66b"
blend = true

[config.custom_colors.caution]
color = "#d89a2b"
blend = true

# Un solo tema propio para todos los clientes con soporte de temas; solo se escribe en los instalados.

[templates.discord_vencord]
input_path = "okaru.theme.css"
output_path = "$XDG_CONFIG_HOME/Vencord/themes/okaru.theme.css"
requires_path = "$XDG_CONFIG_HOME/Vencord"

[templates.discord_vencord_flatpak]
input_path = "okaru.theme.css"
output_path = "~/.var/app/com.discordapp.Discord/config/Vencord/themes/okaru.theme.css"
requires_path = "~/.var/app/com.discordapp.Discord/config/Vencord"

[templates.discord_equicord]
input_path = "okaru.theme.css"
output_path = "$XDG_CONFIG_HOME/Equicord/themes/okaru.theme.css"
requires_path = "$XDG_CONFIG_HOME/Equicord"

[templates.discord_vesktop]
input_path = "okaru.theme.css"
output_path = "$XDG_CONFIG_HOME/vesktop/themes/okaru.theme.css"
requires_path = "$XDG_CONFIG_HOME/vesktop"

[templates.discord_vesktop_flatpak]
input_path = "okaru.theme.css"
output_path = "~/.var/app/dev.vencord.Vesktop/config/vesktop/themes/okaru.theme.css"
requires_path = "~/.var/app/dev.vencord.Vesktop/config/vesktop"

[templates.discord_equibop]
input_path = "okaru.theme.css"
output_path = "$XDG_CONFIG_HOME/equibop/themes/okaru.theme.css"
requires_path = "$XDG_CONFIG_HOME/equibop"

[templates.discord_betterdiscord]
input_path = "okaru.theme.css"
output_path = "$XDG_CONFIG_HOME/BetterDiscord/themes/okaru.theme.css"
requires_path = "$XDG_CONFIG_HOME/BetterDiscord"

[templates.discord_legcord]
input_path = "okaru.theme.css"
output_path = "$XDG_CONFIG_HOME/legcord/themes/okaru.theme.css"
requires_path = "$XDG_CONFIG_HOME/legcord"

[templates.discord_webcord]
input_path = "okaru.theme.css"
output_path = "$XDG_CONFIG_HOME/webcord/themes/okaru.theme.css"
