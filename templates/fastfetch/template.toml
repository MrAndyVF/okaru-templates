[catalog.fastfetch]
name = "Fastfetch"
category = "misc"

[config.custom_colors.added]
color = "#3fa66b"
blend = true

[config.custom_colors.caution]
color = "#d89a2b"
blend = true

# Los colores con nombre (blue, green…) de config.jsonc pasan a los de la paleta; el resto no se toca.
[templates.fastfetch]
input_path = "colors.json"
output_path = "$XDG_CACHE_HOME/okaru/fastfetch-colors.json"
post_hook = "python3 '{{ config_dir }}/recolor.py' apply"
undo_hook = "python3 '{{ config_dir }}/recolor.py' undo"
