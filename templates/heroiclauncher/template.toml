[catalog.heroiclauncher]
name = "Heroic Games Launcher"
category = "gaming"

[config.custom_colors.added]
color = "#3fa66b"
blend = true

[config.custom_colors.caution]
color = "#d89a2b"
blend = true

# Tema propio de Heroic: el nombre del archivo es la clase de <body> ("okaru").
[templates.heroiclauncher]
input_path = "okaru.css"
output_path = "$XDG_CONFIG_HOME/heroic/themes/okaru.css"
requires_path = "$XDG_CONFIG_HOME/heroic"

[templates.heroiclauncher_flatpak]
input_path = "okaru.css"
output_path = "~/.var/app/com.heroicgameslauncher.hgl/config/heroic/themes/okaru.css"
requires_path = "~/.var/app/com.heroicgameslauncher.hgl/config/heroic"
