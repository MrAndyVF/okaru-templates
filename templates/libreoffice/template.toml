[catalog.libreoffice]
name = "LibreOffice"
category = "misc"

[config.custom_colors.added]
color = "#3fa66b"
blend = true

[config.custom_colors.caution]
color = "#d89a2b"
blend = true

# Esquema de color "OKARU" como extensión de LibreOffice. install.py la empaqueta y la instala con unopkg solo
# cuando los colores cambiaron (unopkg tarda unos segundos).
[templates.libreoffice]
input_path = "okaru.xcu"
output_path = "$XDG_CACHE_HOME/okaru/libreoffice-theme/okaru.xcu"
post_hook = "python3 '{{ config_dir }}/install.py' apply"
undo_hook = "python3 '{{ config_dir }}/install.py' undo"
