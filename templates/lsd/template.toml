[catalog.lsd]
name = "lsd"
category = "terminal"

[config.custom_colors.added]
color = "#3fa66b"
blend = true

[config.custom_colors.caution]
color = "#d89a2b"
blend = true

[templates.lsd]
input_path = "colors.yaml"
output_path = "$XDG_CONFIG_HOME/lsd/colors.yaml"
post_hook = "sh '{{ config_dir }}/theme.sh' apply"
undo_hook = "sh '{{ config_dir }}/theme.sh' undo"
