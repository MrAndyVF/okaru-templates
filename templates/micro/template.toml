[catalog.micro]
name = "Micro"
category = "editor"

[config.custom_colors.added]
color = "#3fa66b"
blend = true

[config.custom_colors.caution]
color = "#d89a2b"
blend = true

[templates.micro]
input_path = "okaru.micro"
output_path = "$XDG_CONFIG_HOME/micro/colorschemes/okaru.micro"
post_hook = "python3 '{{ config_dir }}/colorscheme.py' set"
undo_hook = "python3 '{{ config_dir }}/colorscheme.py' unset"
