[catalog.obs]
name = "OBS Studio"
category = "misc"

# Variante de Yami (la base de OBS, como recomienda su sistema de temas): solo se cambian los colores, así el
# tema no se rompe con cada versión. En modo claro hereda de Yami Light para tener los iconos oscuros.
[templates.obs]
input_path = "okaru.ovt"
output_path = "$XDG_CONFIG_HOME/obs-studio/themes/okaru.ovt"
requires_path = "$XDG_CONFIG_HOME/obs-studio"

[templates.obs_flatpak]
input_path = "okaru.ovt"
output_path = "~/.var/app/com.obsproject.Studio/config/obs-studio/themes/okaru.ovt"
requires_path = "~/.var/app/com.obsproject.Studio/config/obs-studio"
