[catalog.papirus-icons]
name = "Papirus folders"
category = "system"

# El motor elige el color de carpeta de Papirus más cercano al primario (closest_color). Se compara con claridad y
# saturación fijas para que mande el tono, no lo claro u oscuro del modo.
# shortcut: un primario casi gris también sale con color; si molesta, añadir un umbral de saturación.
[templates.papirus-icons]
input_path = "folder-color"
output_path = "$XDG_CACHE_HOME/okaru/papirus-folder-color"
compare_to = "{{ colors.primary.default.hex | set_lightness 58 | set_saturation 70 }}"
post_hook = "sh '{{ config_dir }}/recolor.sh' apply '{{ closest_color }}' '{{ mode }}'"
undo_hook = "sh '{{ config_dir }}/recolor.sh' undo"
# Colores de las carpetas de Papirus (cara frontal de places/48x48/folder-<color>.svg).
colors_to_compare = [
  { name = "adwaita", color = "#93c0ea" },
  { name = "black", color = "#4f4f4f" },
  { name = "blue", color = "#5294e2" },
