[catalog.starship]
name = "Starship"
category = "terminal"

[config.custom_colors.added]
color = "#3fa66b"
blend = true

[config.custom_colors.caution]
color = "#d89a2b"
blend = true

# La tabla [palettes.okaru] redefine los colores con nombre del prompt; el hook la mantiene en starship.toml.
[templates.starship]
input_path = "palette.toml"
output_path = "$XDG_CACHE_HOME/okaru/starship-palette.toml"
post_hook = "python3 '{{ config_dir }}/palette.py' apply"
undo_hook = "python3 '{{ config_dir }}/palette.py' undo"
